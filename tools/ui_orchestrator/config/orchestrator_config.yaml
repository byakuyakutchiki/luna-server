# Configuration V0 de luna-ui-orchestrator
# Mode simulation uniquement : aucun clic, aucun envoi réel.

orchestrator:
  name: luna-ui-orchestrator
  version: "0.1.0-simulation"
  shared_dir: /media/windows/Users/saint/Documents/Codex/AGENT_SHARED/ui_orchestrator
  stop_file: STOP
  simulate: true
  log_level: INFO

state_machine:
  initial_state: WAITING_FOR_KIMI
  terminal_states:
    - MISSION_VALIDATED
    - PAUSED
    - ERROR
    - HUMAN_REVIEW_REQUIRED

window_patterns:
  # Codex : fenêtre de l'agent Codex (app ChatGPT avec titre Codex, ou VS Code)
  codex:
    title_regex: "(?i)(^codex$|codex[\\s\\-]|vs code|visual studio code)"
    process_regex: "(?i)(^Code\\.exe$)"

  # ChatGPT secondaire : autre fenêtre de l'app ChatGPT, pas l'onglet Codex actif
  chatgpt:
    title_regex: "(?i)(^chatgpt$|chatgpt[\\s\\-]|openai)"
    process_regex: "(?i)(ChatGPT)"

  # VirtualBox : VM Kimi ou gestionnaire de machines
  virtualbox:
    title_regex: "(?i)(virtualbox|oracle vm|debrt)"
    process_regex: "(?i)(VirtualBox|VirtualBoxVM)"

  # Terminal Windows : Windows Terminal, cmd, PowerShell, ou terminal Linux
  terminal:
    title_regex: "(?i)(kimi|terminal|bash|debian|luna-vm|powershell|cmd\\.exe|system32\\\\cmd)"
    process_regex: "(?i)(WindowsTerminal|cmd|powershell|bash|gnome-terminal|gnome-terminal-server)"

  # Référence documentation Chrome sans risque de confusion avec Codex
  browser_reference:
    title_regex: "(?i)(Automatisation des clics)"
    process_regex: "(?i)(chrome)"

policy:
  allowed_actions:
    - git status
    - git diff
    - git log
    - git log --oneline
    - pytest
    - python3 -m pytest
    - luna --status
    - luna --last-report
    - luna --help

  forbidden_patterns:
    - git reset --hard
    - git clean -fd
    - git push origin main
    - git push main
    - git merge main
    - deploy production
    - real_sms
    - real_call
    - adb install
    - adb uninstall
    - adb reboot
    - rm -rf /

  require_human_for:
    - sudo
    - rm -rf
    - git push
    - git merge
    - adb install
    - deploy
    - production
