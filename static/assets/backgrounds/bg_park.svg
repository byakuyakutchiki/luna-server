<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="60%" stop-color="#B0E0FF"/>
      <stop offset="100%" stop-color="#90EE90"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.75" cy="0.12" r="0.15">
      <stop offset="0%" stop-color="#FFE888" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFE888" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes leaves { 0%{transform:translateX(0)} 50%{transform:translateX(5px)} 100%{transform:translateX(0)} }
      @keyframes birdFly { 0%{transform:translate(0,0)} 50%{transform:translate(30px,-10px)} 100%{transform:translate(60px,0)} }
      .tree-l { animation: leaves 4s ease-in-out infinite; }
      .tree-r { animation: leaves 4s ease-in-out infinite 2s; }
      .bird { animation: birdFly 6s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>
  <!-- Nuages -->
  <ellipse cx="200" cy="100" rx="100" ry="40" fill="#FFF" opacity="0.7"/>
  <ellipse cx="260" cy="90" rx="80" ry="35" fill="#FFF" opacity="0.6"/>
  <ellipse cx="800" cy="130" rx="120" ry="45" fill="#FFF" opacity="0.5"/>
  <ellipse cx="880" cy="120" rx="90" ry="40" fill="#FFF" opacity="0.4"/>

  <!-- Oiseau -->
  <g class="bird">
    <path d="M400 180 Q410 170 420 180 Q430 170 440 180" fill="none" stroke="#333" stroke-width="2"/>
  </g>

  <!-- Collines -->
  <ellipse cx="300" cy="520" rx="500" ry="200" fill="#4CAF50" opacity="0.6"/>
  <ellipse cx="900" cy="540" rx="600" ry="220" fill="#66BB6A" opacity="0.5"/>
  <rect y="480" width="1280" height="240" fill="#4CAF50"/>
  <rect y="480" width="1280" height="10" fill="#66BB6A"/>

  <!-- Chemin -->
  <path d="M500 720 Q580 600 640 500 Q680 420 700 380" fill="none" stroke="#D4C4A8" stroke-width="40" opacity="0.6"/>
  <path d="M500 720 Q580 600 640 500 Q680 420 700 380" fill="none" stroke="#E8D5C4" stroke-width="30" opacity="0.4"/>

  <!-- Arbre gauche -->
  <rect x="120" y="300" width="30" height="180" fill="#8B6F47"/>
  <g class="tree-l">
    <ellipse cx="135" cy="260" rx="80" ry="90" fill="#2E7D32"/>
    <ellipse cx="110" cy="280" rx="60" ry="70" fill="#388E3C"/>
    <ellipse cx="160" cy="270" rx="65" ry="75" fill="#43A047"/>
  </g>

  <!-- Arbre droit -->
  <rect x="980" y="280" width="35" height="200" fill="#8B6F47"/>
  <g class="tree-r">
    <ellipse cx="997" cy="230" rx="90" ry="100" fill="#2E7D32"/>
    <ellipse cx="970" cy="250" rx="70" ry="80" fill="#388E3C"/>
    <ellipse cx="1030" cy="240" rx="75" ry="85" fill="#43A047"/>
  </g>

  <!-- Banc -->
  <rect x="530" y="455" width="220" height="12" rx="3" fill="#8B6F47"/>
  <rect x="540" y="467" width="12" height="35" fill="#7B5F37"/>
  <rect x="730" y="467" width="12" height="35" fill="#7B5F37"/>
  <rect x="535" y="438" width="210" height="8" rx="2" fill="#A08060"/>

  <!-- Fleurs -->
  <circle cx="450" cy="495" r="5" fill="#FF69B4" opacity="0.8"/>
  <circle cx="465" cy="500" r="4" fill="#FFD700" opacity="0.7"/>
  <circle cx="480" cy="493" r="5" fill="#FF6B6B" opacity="0.8"/>
  <circle cx="820" cy="498" r="4" fill="#FF69B4" opacity="0.7"/>
  <circle cx="840" cy="492" r="5" fill="#FFD700" opacity="0.8"/>

  <!-- Soleil -->
  <rect width="1280" height="720" fill="url(#sun)"/>
  <circle cx="960" cy="80" r="40" fill="#FFD700" opacity="0.6"/>
</svg>
