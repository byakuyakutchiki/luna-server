<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0E6D8"/>
      <stop offset="100%" stop-color="#E8DCD0"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.4" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#FFE088" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFE088" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#wall)"/>
  <rect y="560" width="1280" height="160" fill="#C4A882" opacity="0.8"/>
  <!-- Taches peinture sol -->
  <circle cx="400" cy="600" r="12" fill="#FF6B6B" opacity="0.2"/>
  <circle cx="550" cy="620" r="8" fill="#4ECDC4" opacity="0.15"/>
  <circle cx="480" cy="590" r="10" fill="#FFE66D" opacity="0.2"/>

  <!-- Chevalet -->
  <line x1="250" y1="200" x2="300" y2="550" stroke="#8B6F47" stroke-width="8"/>
  <line x1="450" y1="200" x2="400" y2="550" stroke="#8B6F47" stroke-width="8"/>
  <line x1="350" y1="350" x2="450" y2="560" stroke="#8B6F47" stroke-width="6"/>
  <rect x="230" y="160" width="240" height="210" rx="4" fill="#FFF" stroke="#8B6F47" stroke-width="3"/>
  <circle cx="300" cy="240" r="30" fill="#FF6B6B" opacity="0.7"/>
  <circle cx="370" cy="270" r="35" fill="#4ECDC4" opacity="0.6"/>
  <circle cx="330" cy="310" r="25" fill="#FFE66D" opacity="0.7"/>
  <rect x="280" y="220" width="70" height="10" fill="#6B5CE7" opacity="0.5" transform="rotate(-15 315 225)"/>
  <circle cx="390" cy="230" r="18" fill="#FF9F43" opacity="0.5"/>

  <!-- Etagere avec pots -->
  <rect x="700" y="200" width="400" height="15" fill="#8B6F47"/>
  <rect x="720" y="160" width="30" height="40" rx="4" fill="#FF6B6B"/>
  <rect x="770" y="155" width="35" height="45" rx="4" fill="#4ECDC4"/>
  <rect x="825" y="165" width="25" height="35" rx="4" fill="#FFE66D"/>
  <rect x="870" y="158" width="30" height="42" rx="4" fill="#6B5CE7"/>
  <rect x="920" y="162" width="28" height="38" rx="4" fill="#FF9F43"/>
  <rect x="970" y="155" width="32" height="45" rx="4" fill="#A8E6CF"/>

  <!-- Fenetre -->
  <rect x="850" y="300" width="300" height="250" rx="6" fill="#87CEEB" opacity="0.4"/>
  <rect x="846" y="296" width="308" height="258" rx="8" fill="none" stroke="#C4A882" stroke-width="6"/>

  <!-- Pinceaux dans un pot -->
  <rect x="650" y="430" width="50" height="60" rx="6" fill="#C4A882"/>
  <line x1="660" y1="430" x2="655" y2="380" stroke="#8B6F47" stroke-width="3"/>
  <line x1="672" y1="430" x2="670" y2="375" stroke="#8B6F47" stroke-width="3"/>
  <line x1="685" y1="430" x2="690" y2="378" stroke="#8B6F47" stroke-width="3"/>
  <circle cx="655" cy="377" r="5" fill="#FF6B6B"/>
  <circle cx="670" cy="372" r="5" fill="#4ECDC4"/>
  <circle cx="690" cy="375" r="5" fill="#FFE66D"/>

  <rect width="1280" height="720" fill="url(#warm)"/>
</svg>
