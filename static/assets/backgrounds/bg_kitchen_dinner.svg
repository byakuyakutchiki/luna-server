<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5E0C8"/>
      <stop offset="100%" stop-color="#E8CDB0"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="50%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FFD4A8"/>
    </linearGradient>
    <radialGradient id="evening" cx="0.7" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#FF8C42" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF8C42" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes steam1 { 0%{opacity:0;transform:translateY(0)} 50%{opacity:0.5} 100%{opacity:0;transform:translateY(-50px)} }
      @keyframes steam2 { 0%{opacity:0;transform:translateY(0)} 50%{opacity:0.4} 100%{opacity:0;transform:translateY(-60px)} }
      @keyframes steam3 { 0%{opacity:0;transform:translateY(0)} 50%{opacity:0.35} 100%{opacity:0;transform:translateY(-45px)} }
      @keyframes sunsetPulse { 0%{opacity:0.15} 50%{opacity:0.22} 100%{opacity:0.15} }
      .steam1 { animation: steam1 2.8s ease-in-out infinite; }
      .steam2 { animation: steam2 3.2s ease-in-out infinite 0.6s; }
      .steam3 { animation: steam3 3s ease-in-out infinite 1.2s; }
      .sunset { animation: sunsetPulse 6s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#wall)"/>
  <rect y="550" width="1280" height="170" fill="#C4A882"/>
  <rect y="380" width="1280" height="30" fill="#8B7355"/>
  <rect y="410" width="1280" height="140" fill="#A0896B"/>

  <!-- Placards -->
  <rect x="50" y="50" width="250" height="200" rx="8" fill="#C4A882"/>
  <rect x="55" y="55" width="115" height="190" rx="4" fill="#D4C4A8"/>
  <rect x="180" y="55" width="115" height="190" rx="4" fill="#D4C4A8"/>

  <!-- Casserole -->
  <ellipse cx="450" cy="370" rx="55" ry="16" fill="#888"/>
  <rect x="395" y="335" width="110" height="35" rx="8" fill="#777"/>
  <line x1="505" y1="352" x2="570" y2="352" stroke="#666" stroke-width="6" stroke-linecap="round"/>

  <!-- Vapeur -->
  <path class="steam1" d="M415 325 Q420 295 425 325" fill="none" stroke="#DDD" stroke-width="2"/>
  <path class="steam2" d="M445 320 Q450 285 455 320" fill="none" stroke="#DDD" stroke-width="2"/>
  <path class="steam3" d="M475 323 Q480 290 485 323" fill="none" stroke="#DDD" stroke-width="2"/>

  <!-- Fenetre coucher de soleil -->
  <rect x="800" y="60" width="350" height="300" rx="8" fill="url(#sunset)" opacity="0.7"/>
  <rect x="796" y="56" width="358" height="308" rx="10" fill="none" stroke="#C4A882" stroke-width="6"/>
  <line x1="975" y1="56" x2="975" y2="364" stroke="#C4A882" stroke-width="4"/>

  <!-- Bouteille de vin -->
  <rect x="780" y="340" width="18" height="40" rx="3" fill="#4A0E2E"/>
  <rect x="784" y="330" width="10" height="12" rx="2" fill="#4A0E2E"/>

  <rect class="sunset" width="1280" height="720" fill="url(#evening)"/>
</svg>
