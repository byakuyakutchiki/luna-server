<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-all-services" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0d0b2a"/>
    </radialGradient>
    <linearGradient id="sym-all-services" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow-all-services">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#6366f1" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-all-services)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#6366f1" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Circuit connections -->
  <line x1="60" y1="60" x2="60" y2="40" stroke="url(#sym-all-services)" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="60" x2="80" y2="60" stroke="url(#sym-all-services)" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="60" x2="60" y2="80" stroke="url(#sym-all-services)" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="60" x2="40" y2="60" stroke="url(#sym-all-services)" stroke-width="1.5" opacity="0.5"/>
  <!-- Corner connections (right-angle circuit style) -->
  <polyline points="60,40 78,40 80,60" fill="none" stroke="url(#sym-all-services)" stroke-width="1" opacity="0.3"/>
  <polyline points="80,60 78,80 60,80" fill="none" stroke="url(#sym-all-services)" stroke-width="1" opacity="0.3"/>
  <polyline points="60,80 42,80 40,60" fill="none" stroke="url(#sym-all-services)" stroke-width="1" opacity="0.3"/>
  <polyline points="40,60 42,40 60,40" fill="none" stroke="url(#sym-all-services)" stroke-width="1" opacity="0.3"/>
  <!-- Central core -->
  <circle cx="60" cy="60" r="10" fill="url(#sym-all-services)" filter="url(#glow-all-services)"/>
  <circle cx="60" cy="60" r="6" fill="#0d0b2a" opacity="0.8"/>
  <circle cx="60" cy="60" r="3" fill="url(#sym-all-services)" opacity="0.9"/>
  <!-- 4 satellite nodes -->
  <circle cx="60" cy="40" r="6" fill="url(#sym-all-services)" filter="url(#glow-all-services)"/>
  <circle cx="80" cy="60" r="6" fill="url(#sym-all-services)" filter="url(#glow-all-services)"/>
  <circle cx="60" cy="80" r="6" fill="url(#sym-all-services)" filter="url(#glow-all-services)"/>
  <circle cx="40" cy="60" r="6" fill="url(#sym-all-services)" filter="url(#glow-all-services)"/>
  <!-- Check marks in each satellite node -->
  <polyline points="57,40 59.5,42.5 63,38" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="77,60 79.5,62.5 83,58" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="57,80 59.5,82.5 63,78" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="37,60 39.5,62.5 43,58" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#818cf8" opacity="0.55"/>
</svg>
