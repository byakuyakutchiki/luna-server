<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-client-l10" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1a0800"/>
    </radialGradient>
    <linearGradient id="sym-client-l10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-client-l10">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-client-l10-strong">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#fbbf24" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-client-l10)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Large mentor star (6-point) -->
  <polygon points="60,36 65,50 80,50 68.5,59.5 73,74 60,65 47,74 51.5,59.5 40,50 55,50" fill="url(#sym-client-l10)" filter="url(#glow-client-l10-strong)"/>
  <!-- Inner glow -->
  <circle cx="60" cy="57" r="10" fill="#fbbf24" opacity="0.4"/>
  <!-- Small satellite star (upper right) -->
  <polygon points="80,36 81.8,41.5 87.5,41.5 82.8,44.9 84.6,50.5 80,47 75.4,50.5 77.2,44.9 72.5,41.5 78.2,41.5" fill="url(#sym-client-l10)" opacity="0.9" filter="url(#glow-client-l10)"/>
  <!-- Connection line large to small star -->
  <line x1="68" y1="44" x2="75" y2="42" stroke="url(#sym-client-l10)" stroke-width="1" opacity="0.4"/>
  <!-- Halo ring of wisdom -->
  <circle cx="60" cy="57" r="26" fill="none" stroke="url(#sym-client-l10)" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  <!-- Outer sparkles -->
  <line x1="60" y1="30" x2="60" y2="34" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="38" y1="48" x2="41" y2="51" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="40" y1="75" x2="43" y2="72" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#fbbf24" opacity="0.55"/>
</svg>
