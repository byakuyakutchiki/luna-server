<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-zero-alerts" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#5c2d00"/>
      <stop offset="100%" stop-color="#1a0c00"/>
    </radialGradient>
    <linearGradient id="sym-zero-alerts" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="glow-zero-alerts">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#f59e0b" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-zero-alerts)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#d97706" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Solar sphere center -->
  <circle cx="60" cy="60" r="16" fill="url(#sym-zero-alerts)" filter="url(#glow-zero-alerts)"/>
  <circle cx="60" cy="60" r="11" fill="#fde68a" opacity="0.6"/>
  <circle cx="60" cy="60" r="7" fill="white" opacity="0.3"/>
  <!-- 8 rays of varying lengths -->
  <!-- Ray 0 (up) long -->
  <line x1="60" y1="44" x2="60" y2="34" stroke="url(#sym-zero-alerts)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-zero-alerts)"/>
  <!-- Ray 1 (up-right) medium -->
  <line x1="71" y1="49" x2="78" y2="42" stroke="url(#sym-zero-alerts)" stroke-width="2" stroke-linecap="round" filter="url(#glow-zero-alerts)" opacity="0.85"/>
  <!-- Ray 2 (right) long -->
  <line x1="76" y1="60" x2="86" y2="60" stroke="url(#sym-zero-alerts)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-zero-alerts)"/>
  <!-- Ray 3 (down-right) medium -->
  <line x1="71" y1="71" x2="78" y2="78" stroke="url(#sym-zero-alerts)" stroke-width="2" stroke-linecap="round" filter="url(#glow-zero-alerts)" opacity="0.85"/>
  <!-- Ray 4 (down) long -->
  <line x1="60" y1="76" x2="60" y2="86" stroke="url(#sym-zero-alerts)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-zero-alerts)"/>
  <!-- Ray 5 (down-left) medium -->
  <line x1="49" y1="71" x2="42" y2="78" stroke="url(#sym-zero-alerts)" stroke-width="2" stroke-linecap="round" filter="url(#glow-zero-alerts)" opacity="0.85"/>
  <!-- Ray 6 (left) long -->
  <line x1="44" y1="60" x2="34" y2="60" stroke="url(#sym-zero-alerts)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-zero-alerts)"/>
  <!-- Ray 7 (up-left) medium -->
  <line x1="49" y1="49" x2="42" y2="42" stroke="url(#sym-zero-alerts)" stroke-width="2" stroke-linecap="round" filter="url(#glow-zero-alerts)" opacity="0.85"/>
  <!-- Outer glow halo -->
  <circle cx="60" cy="60" r="32" fill="none" stroke="#fde68a" stroke-width="0.5" opacity="0.25"/>
  <!-- Zen dots (three small circles in arc below) -->
  <circle cx="52" cy="82" r="1.5" fill="#fde68a" opacity="0.6"/>
  <circle cx="60" cy="84" r="1.5" fill="#fde68a" opacity="0.6"/>
  <circle cx="68" cy="82" r="1.5" fill="#fde68a" opacity="0.6"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#f59e0b" opacity="0.55"/>
</svg>
