<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-first-client" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3d1060"/>
      <stop offset="100%" stop-color="#110020"/>
    </radialGradient>
    <linearGradient id="sym-first-client" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-first-client">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#9b59b6" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-first-client)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#9b59b6" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Seal outer ring -->
  <circle cx="60" cy="60" r="23" fill="none" stroke="url(#sym-first-client)" stroke-width="2.5" filter="url(#glow-first-client)"/>
  <!-- Seal inner ring -->
  <circle cx="60" cy="60" r="18" fill="none" stroke="url(#sym-first-client)" stroke-width="0.8" opacity="0.4"/>
  <!-- Central star (6-point) -->
  <polygon points="60,42 63.5,52.5 75,52.5 65.5,59 68.5,70 60,63.5 51.5,70 54.5,59 45,52.5 56.5,52.5" fill="url(#sym-first-client)" filter="url(#glow-first-client)"/>
  <!-- Number 1 bar (vertical + top serif) -->
  <line x1="60" y1="49" x2="60" y2="66" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <line x1="56" y1="52" x2="60" y2="49" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <line x1="56" y1="66" x2="64" y2="66" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <!-- Rays around the seal (8 short lines) -->
  <line x1="60" y1="33" x2="60" y2="37" stroke="url(#sym-first-client)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="60" y1="83" x2="60" y2="87" stroke="url(#sym-first-client)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="33" y1="60" x2="37" y2="60" stroke="url(#sym-first-client)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="83" y1="60" x2="87" y2="60" stroke="url(#sym-first-client)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="41" y1="41" x2="44" y2="44" stroke="url(#sym-first-client)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="79" y1="41" x2="76" y2="44" stroke="url(#sym-first-client)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="41" y1="79" x2="44" y2="76" stroke="url(#sym-first-client)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="79" y1="79" x2="76" y2="76" stroke="url(#sym-first-client)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#fbbf24" opacity="0.55"/>
</svg>
