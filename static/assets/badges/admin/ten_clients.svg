<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-ten-clients" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1a0800"/>
    </radialGradient>
    <linearGradient id="sym-ten-clients" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-ten-clients">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#fbbf24" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-ten-clients)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Crown main body -->
  <path d="M36,74 L40,50 L52,62 L60,40 L68,62 L80,50 L84,74 Z" fill="url(#sym-ten-clients)" opacity="0.92" filter="url(#glow-ten-clients)"/>
  <!-- Crown base bar -->
  <rect x="36" y="74" width="48" height="8" rx="4" fill="url(#sym-ten-clients)" opacity="0.92"/>
  <!-- Crown gems at points -->
  <circle cx="40" cy="50" r="4" fill="#fbbf24" stroke="white" stroke-width="1"/>
  <circle cx="60" cy="40" r="5" fill="#fef3c7" stroke="white" stroke-width="1"/>
  <circle cx="80" cy="50" r="4" fill="#fbbf24" stroke="white" stroke-width="1"/>
  <!-- Middle gems on base -->
  <circle cx="48" cy="78" r="3" fill="#f59e0b" opacity="0.8"/>
  <circle cx="60" cy="78" r="3.5" fill="#fef3c7" opacity="0.9"/>
  <circle cx="72" cy="78" r="3" fill="#f59e0b" opacity="0.8"/>
  <!-- Top center star -->
  <line x1="60" y1="36" x2="60" y2="44" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="40" x2="64" y2="40" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Inner crown highlight -->
  <path d="M44,74 L47,58 L52,63 L60,48 L68,63 L73,58 L76,74" fill="none" stroke="white" stroke-width="0.5" opacity="0.25"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#fbbf24" opacity="0.55"/>
</svg>
