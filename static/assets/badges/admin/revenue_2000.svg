<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-revenue-2000" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1a0800"/>
    </radialGradient>
    <linearGradient id="sym-revenue-2000-v" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="sym-revenue-2000" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-revenue-2000">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#fbbf24" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-revenue-2000)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Bar 1 (leftmost, shortest) -->
  <rect x="36" y="68" width="12" height="12" rx="2" fill="url(#sym-revenue-2000-v)" opacity="0.7" filter="url(#glow-revenue-2000)"/>
  <!-- Bar 2 -->
  <rect x="51" y="58" width="12" height="22" rx="2" fill="url(#sym-revenue-2000-v)" opacity="0.8" filter="url(#glow-revenue-2000)"/>
  <!-- Bar 3 -->
  <rect x="66" y="45" width="12" height="35" rx="2" fill="url(#sym-revenue-2000-v)" opacity="0.9" filter="url(#glow-revenue-2000)"/>
  <!-- Baseline -->
  <line x1="34" y1="80" x2="80" y2="80" stroke="url(#sym-revenue-2000)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Ascending arrow overlay -->
  <path d="M38,70 L56,55 L72,42" fill="none" stroke="url(#sym-revenue-2000)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <polygon points="72,42 65,44 70,49" fill="url(#sym-revenue-2000)" opacity="0.9"/>
  <!-- Top glow -->
  <circle cx="72" cy="44" r="4" fill="#fbbf24" opacity="0.4" filter="url(#glow-revenue-2000)"/>
  <!-- Star at arrow tip -->
  <line x1="72" y1="38" x2="72" y2="42" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="69" y1="40" x2="75" y2="40" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#fbbf24" opacity="0.55"/>
</svg>
