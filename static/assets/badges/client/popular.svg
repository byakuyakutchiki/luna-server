<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-popular" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1a0800"/>
    </radialGradient>
    <linearGradient id="sym-popular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-popular">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#fbbf24" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-popular)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Outer orbit ring -->
  <circle cx="60" cy="60" r="30" fill="none" stroke="url(#sym-popular)" stroke-width="1" stroke-dasharray="6 3" opacity="0.5"/>
  <!-- Connection lines to satellites -->
  <line x1="60" y1="60" x2="60" y2="38" stroke="url(#sym-popular)" stroke-width="1" opacity="0.4"/>
  <line x1="60" y1="60" x2="81" y2="67" stroke="url(#sym-popular)" stroke-width="1" opacity="0.4"/>
  <line x1="60" y1="60" x2="72" y2="86" stroke="url(#sym-popular)" stroke-width="1" opacity="0.4"/>
  <line x1="60" y1="60" x2="48" y2="86" stroke="url(#sym-popular)" stroke-width="1" opacity="0.4"/>
  <line x1="60" y1="60" x2="39" y2="67" stroke="url(#sym-popular)" stroke-width="1" opacity="0.4"/>
  <!-- Central node -->
  <circle cx="60" cy="60" r="9" fill="url(#sym-popular)" filter="url(#glow-popular)"/>
  <circle cx="60" cy="60" r="5" fill="white" opacity="0.5"/>
  <!-- 5 satellite nodes (pentagonal layout) -->
  <circle cx="60" cy="38" r="6" fill="url(#sym-popular)" opacity="0.8" filter="url(#glow-popular)"/>
  <circle cx="81" cy="67" r="6" fill="url(#sym-popular)" opacity="0.8" filter="url(#glow-popular)"/>
  <circle cx="72" cy="86" r="6" fill="url(#sym-popular)" opacity="0.8" filter="url(#glow-popular)"/>
  <circle cx="48" cy="86" r="6" fill="url(#sym-popular)" opacity="0.8" filter="url(#glow-popular)"/>
  <circle cx="39" cy="67" r="6" fill="url(#sym-popular)" opacity="0.8" filter="url(#glow-popular)"/>
  <!-- Small inner glows -->
  <circle cx="60" cy="38" r="2.5" fill="white" opacity="0.5"/>
  <circle cx="81" cy="67" r="2.5" fill="white" opacity="0.5"/>
  <circle cx="72" cy="86" r="2.5" fill="white" opacity="0.5"/>
  <circle cx="48" cy="86" r="2.5" fill="white" opacity="0.5"/>
  <circle cx="39" cy="67" r="2.5" fill="white" opacity="0.5"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#fbbf24" opacity="0.55"/>
</svg>
