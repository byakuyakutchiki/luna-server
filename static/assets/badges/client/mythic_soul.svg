<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-mythic" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e0933"/>
      <stop offset="100%" stop-color="#0a0218"/>
    </radialGradient>
    <linearGradient id="sym-mythic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow-mythic">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#a855f7" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#e879f9" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-mythic)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#a855f7" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Soul orb -->
  <circle cx="60" cy="56" r="18" fill="url(#sym-mythic)" opacity="0.7" filter="url(#glow-mythic)"/>
  <circle cx="60" cy="56" r="12" fill="url(#sym-mythic)" opacity="0.5" filter="url(#glow-mythic)"/>
  <circle cx="60" cy="56" r="6" fill="white" opacity="0.4"/>
  <!-- Orbiting rings -->
  <ellipse cx="60" cy="56" rx="26" ry="10" fill="none" stroke="#e879f9" stroke-width="1.2" opacity="0.4" transform="rotate(-30 60 56)"/>
  <ellipse cx="60" cy="56" rx="26" ry="10" fill="none" stroke="#6366f1" stroke-width="1.2" opacity="0.4" transform="rotate(30 60 56)"/>
  <!-- Sparkles -->
  <circle cx="36" cy="40" r="2" fill="#e879f9" opacity="0.7" filter="url(#glow-mythic)"/>
  <circle cx="84" cy="38" r="1.5" fill="#a855f7" opacity="0.6"/>
  <circle cx="40" cy="78" r="1.5" fill="#6366f1" opacity="0.5"/>
  <circle cx="82" cy="76" r="2" fill="#e879f9" opacity="0.6"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#e879f9" opacity="0.55"/>
</svg>
