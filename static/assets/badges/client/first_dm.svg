<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-first-dm" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3d1060"/>
      <stop offset="100%" stop-color="#110020"/>
    </radialGradient>
    <linearGradient id="sym-first-dm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-first-dm">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#9b59b6" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-first-dm)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#9b59b6" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Envelope body -->
  <rect x="30" y="42" width="60" height="40" rx="4" fill="url(#sym-first-dm)" opacity="0.8" filter="url(#glow-first-dm)"/>
  <!-- Envelope flap (V fold) -->
  <polygon points="30,42 60,64 90,42" fill="#3d1060" opacity="0.6"/>
  <polyline points="30,42 60,64 90,42" fill="none" stroke="url(#sym-first-dm)" stroke-width="1.5" opacity="0.8"/>
  <!-- Fold line center -->
  <line x1="30" y1="82" x2="60" y2="64" stroke="url(#sym-first-dm)" stroke-width="0.8" opacity="0.3"/>
  <line x1="90" y1="82" x2="60" y2="64" stroke="url(#sym-first-dm)" stroke-width="0.8" opacity="0.3"/>
  <!-- Wax seal circle -->
  <circle cx="60" cy="70" r="8" fill="#110020" stroke="#fbbf24" stroke-width="1.5" filter="url(#glow-first-dm)"/>
  <!-- Star in seal -->
  <line x1="60" y1="65" x2="60" y2="75" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="55" y1="70" x2="65" y2="70" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56.5" y1="66.5" x2="63.5" y2="73.5" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <line x1="63.5" y1="66.5" x2="56.5" y2="73.5" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#fbbf24" opacity="0.55"/>
</svg>
