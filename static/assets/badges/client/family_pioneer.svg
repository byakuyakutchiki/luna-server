<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-family-pioneer" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#5c2d00"/>
      <stop offset="100%" stop-color="#1a0c00"/>
    </radialGradient>
    <linearGradient id="sym-family-pioneer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="glow-family-pioneer">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#f59e0b" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-family-pioneer)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#d97706" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Protection halo -->
  <circle cx="60" cy="60" r="32" fill="none" stroke="url(#sym-family-pioneer)" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.5" filter="url(#glow-family-pioneer)"/>
  <!-- House walls -->
  <rect x="43" y="57" width="34" height="22" rx="1" fill="url(#sym-family-pioneer)" opacity="0.8" filter="url(#glow-family-pioneer)"/>
  <!-- Roof triangle -->
  <polygon points="38,57 60,38 82,57" fill="url(#sym-family-pioneer)" opacity="0.9" filter="url(#glow-family-pioneer)"/>
  <!-- Door -->
  <rect x="55" y="67" width="10" height="12" rx="2" fill="#5c2d00" opacity="0.8"/>
  <!-- Door knob -->
  <circle cx="63" cy="73" r="1.2" fill="#fbbf24" opacity="0.8"/>
  <!-- Window left -->
  <rect x="46" y="62" width="8" height="7" rx="1" fill="#fbbf24" opacity="0.3"/>
  <!-- Window right -->
  <rect x="66" y="62" width="8" height="7" rx="1" fill="#fbbf24" opacity="0.3"/>
  <!-- Roof ridge star -->
  <line x1="60" y1="34" x2="60" y2="40" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <line x1="57" y1="37" x2="63" y2="37" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#f59e0b" opacity="0.55"/>
</svg>
