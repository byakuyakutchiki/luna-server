<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-two-week" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3d1060"/>
      <stop offset="100%" stop-color="#110020"/>
    </radialGradient>
    <linearGradient id="sym-two-week" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-two-week">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#9b59b6" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-two-week)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#9b59b6" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Left small flame -->
  <path d="M40,36 C34,44 30,53 32,63 C33,67 36,70 40,71 C44,70 47,67 48,63 C50,53 46,44 40,36 Z" fill="url(#sym-two-week)" opacity="0.75" transform="scale(0.85) translate(7,5)"/>
  <!-- Right small flame -->
  <path d="M80,36 C74,44 70,53 72,63 C73,67 76,70 80,71 C84,70 87,67 88,63 C90,53 86,44 80,36 Z" fill="url(#sym-two-week)" opacity="0.75" transform="scale(0.85) translate(-5,5)"/>
  <!-- Central large flame -->
  <path d="M60,32 C52,42 46,54 49,66 C51,72 55,77 60,79 C65,77 69,72 71,66 C74,54 68,42 60,32 Z" fill="url(#sym-two-week)" opacity="0.95" filter="url(#glow-two-week)"/>
  <!-- Inner flame center -->
  <path d="M60,44 C56,51 54,58 56,65 C57,68 59,71 60,72 C61,71 63,68 64,65 C66,58 64,51 60,44 Z" fill="white" opacity="0.22"/>
  <!-- Connecting glow bar -->
  <rect x="36" y="76" width="48" height="2" rx="1" fill="url(#sym-two-week)" opacity="0.35"/>
  <!-- Tip glow center -->
  <circle cx="60" cy="35" r="3" fill="white" opacity="0.5"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#fbbf24" opacity="0.55"/>
</svg>
