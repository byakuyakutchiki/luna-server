<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-week-streak" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3d1060"/>
      <stop offset="100%" stop-color="#110020"/>
    </radialGradient>
    <linearGradient id="sym-week-streak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-week-streak">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#9b59b6" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-week-streak)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#9b59b6" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Flame outer -->
  <path d="M60,30 C50,42 42,55 45,68 C47,75 52,80 60,82 C68,80 73,75 75,68 C78,55 70,42 60,30 Z" fill="url(#sym-week-streak)" opacity="0.9" filter="url(#glow-week-streak)"/>
  <!-- Flame inner -->
  <path d="M60,42 C54,50 50,58 52,67 C53,71 56,74 60,75 C64,74 67,71 68,67 C70,58 66,50 60,42 Z" fill="white" opacity="0.2"/>
  <!-- Tip glow -->
  <circle cx="60" cy="33" r="4" fill="white" opacity="0.5" filter="url(#glow-week-streak)"/>
  <!-- Core glow -->
  <circle cx="60" cy="65" r="6" fill="#fbbf24" opacity="0.3"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#fbbf24" opacity="0.55"/>
</svg>
