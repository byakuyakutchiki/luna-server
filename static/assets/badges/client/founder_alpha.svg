<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-founder" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1c1a2e"/>
      <stop offset="100%" stop-color="#0a0918"/>
    </radialGradient>
    <linearGradient id="sym-founder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow-founder">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#f59e0b" opacity="0.2"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-founder)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Crown -->
  <polygon points="60,28 70,44 84,36 80,54 40,54 36,36 50,44" fill="url(#sym-founder)" opacity="0.9" filter="url(#glow-founder)"/>
  <!-- Crown gems -->
  <circle cx="60" cy="32" r="3" fill="#fff" opacity="0.8"/>
  <circle cx="50" cy="44" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="70" cy="44" r="2" fill="#fff" opacity="0.7"/>
  <!-- Alpha letter -->
  <text x="60" y="78" text-anchor="middle" fill="#fbbf24" font-size="18" font-weight="bold" font-family="serif" opacity="0.9" filter="url(#glow-founder)">α</text>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#fbbf24" opacity="0.55"/>
</svg>
