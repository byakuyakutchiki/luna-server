<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-family-comm" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e3a6e"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>
    <linearGradient id="sym-family-comm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-family-comm">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#3b82f6" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-family-comm)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#3b82f6" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Origin point -->
  <circle cx="60" cy="76" r="6" fill="url(#sym-family-comm)" filter="url(#glow-family-comm)"/>
  <circle cx="60" cy="76" r="3" fill="white" opacity="0.6"/>
  <!-- Arc 1 small -->
  <path d="M48,70 Q60,58 72,70" fill="none" stroke="url(#sym-family-comm)" stroke-width="2.5" stroke-linecap="round" opacity="1" filter="url(#glow-family-comm)"/>
  <!-- Arc 2 medium -->
  <path d="M40,66 Q60,46 80,66" fill="none" stroke="url(#sym-family-comm)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Arc 3 large -->
  <path d="M32,62 Q60,34 88,62" fill="none" stroke="url(#sym-family-comm)" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
  <!-- Stars at endpoints of large arc -->
  <line x1="32" y1="59" x2="32" y2="65" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="29" y1="62" x2="35" y2="62" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="88" y1="59" x2="88" y2="65" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="85" y1="62" x2="91" y2="62" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#fbbf24" opacity="0.55"/>
</svg>
