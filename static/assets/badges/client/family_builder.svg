<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-family-builder" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e3a6e"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>
    <linearGradient id="sym-family-builder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-family-builder">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#3b82f6" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-family-builder)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#3b82f6" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Connection lines -->
  <line x1="60" y1="60" x2="44" y2="48" stroke="url(#sym-family-builder)" stroke-width="1.2" opacity="0.5"/>
  <line x1="60" y1="60" x2="76" y2="48" stroke="url(#sym-family-builder)" stroke-width="1.2" opacity="0.5"/>
  <line x1="60" y1="60" x2="44" y2="72" stroke="url(#sym-family-builder)" stroke-width="1.2" opacity="0.5"/>
  <line x1="60" y1="60" x2="76" y2="72" stroke="url(#sym-family-builder)" stroke-width="1.2" opacity="0.5"/>
  <line x1="60" y1="60" x2="60" y2="40" stroke="url(#sym-family-builder)" stroke-width="1.2" opacity="0.5"/>
  <!-- Center node -->
  <circle cx="60" cy="60" r="7" fill="url(#sym-family-builder)" filter="url(#glow-family-builder)"/>
  <!-- Satellite nodes -->
  <circle cx="44" cy="48" r="5" fill="url(#sym-family-builder)" opacity="0.85" filter="url(#glow-family-builder)"/>
  <circle cx="76" cy="48" r="5" fill="url(#sym-family-builder)" opacity="0.85" filter="url(#glow-family-builder)"/>
  <circle cx="44" cy="72" r="5" fill="url(#sym-family-builder)" opacity="0.85" filter="url(#glow-family-builder)"/>
  <circle cx="76" cy="72" r="5" fill="url(#sym-family-builder)" opacity="0.85" filter="url(#glow-family-builder)"/>
  <!-- Top node -->
  <circle cx="60" cy="40" r="5" fill="url(#sym-family-builder)" opacity="0.9" filter="url(#glow-family-builder)"/>
  <!-- Center dot -->
  <circle cx="60" cy="60" r="2.5" fill="white" opacity="0.7"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#fbbf24" opacity="0.55"/>
