<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-helper" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#011008"/>
    </radialGradient>
    <linearGradient id="sym-helper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow-helper">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#059669" opacity="0.2"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#34d399" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-helper)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#059669" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Helping hands -->
  <ellipse cx="48" cy="62" rx="10" ry="7" rx2="10" fill="url(#sym-helper)" opacity="0.8" filter="url(#glow-helper)"/>
  <ellipse cx="72" cy="62" rx="10" ry="7" fill="url(#sym-helper)" opacity="0.8" filter="url(#glow-helper)"/>
  <!-- Heart above -->
  <path d="M60,44 Q64,38 68,42 Q72,46 60,54 Q48,46 52,42 Q56,38 60,44 Z" fill="#34d399" opacity="0.9" filter="url(#glow-helper)"/>
  <!-- Star top -->
  <polygon points="60,28 62,33 68,33 63,37 65,43 60,39 55,43 57,37 52,33 58,33" fill="#fbbf24" opacity="0.8"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#34d399" opacity="0.55"/>
</svg>
