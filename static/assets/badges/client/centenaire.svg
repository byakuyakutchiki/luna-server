<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-centenaire" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1a0800"/>
    </radialGradient>
    <linearGradient id="sym-centenaire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-centenaire">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#fbbf24" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-centenaire)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Seal outer ring -->
  <circle cx="60" cy="60" r="27" fill="none" stroke="url(#sym-centenaire)" stroke-width="3" filter="url(#glow-centenaire)"/>
  <!-- Laurel arcs -->
  <path d="M38,55 Q30,42 42,34" fill="none" stroke="url(#sym-centenaire)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M38,55 Q28,52 30,40" fill="none" stroke="url(#sym-centenaire)" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <path d="M82,55 Q90,42 78,34" fill="none" stroke="url(#sym-centenaire)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M82,55 Q92,52 90,40" fill="none" stroke="url(#sym-centenaire)" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <!-- Three stars arc at top -->
  <line x1="48" y1="36" x2="48" y2="40" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="45" y1="38" x2="51" y2="38" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="33" x2="60" y2="37" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="57" y1="35" x2="63" y2="35" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="72" y1="36" x2="72" y2="40" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="69" y1="38" x2="75" y2="38" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <!-- C arc (century letter) path -->
  <path d="M72,52 Q60,44 48,52 Q40,58 44,68 Q48,78 60,80 Q72,78 76,68" fill="none" stroke="url(#sym-centenaire)" stroke-width="5" stroke-linecap="round" filter="url(#glow-centenaire)"/>
  <!-- Glow center -->
  <circle cx="60" cy="62" r="8" fill="#fbbf24" opacity="0.15"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#fbbf24" opacity="0.55"/>
</svg>
