<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-first-instr" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3d1060"/>
      <stop offset="100%" stop-color="#110020"/>
    </radialGradient>
    <linearGradient id="sym-first-instr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-first-instr">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#9b59b6" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-first-instr)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#9b59b6" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Scroll/Parchment top roll -->
  <rect x="40" y="33" width="40" height="5" rx="2.5" fill="url(#sym-first-instr)" opacity="0.7"/>
  <!-- Main scroll body -->
  <rect x="42" y="36" width="36" height="48" rx="4" fill="url(#sym-first-instr)" opacity="0.75" filter="url(#glow-first-instr)"/>
  <!-- Scroll bottom roll -->
  <rect x="40" y="82" width="40" height="5" rx="2.5" fill="url(#sym-first-instr)" opacity="0.7"/>
  <!-- Highlighted first line (command) -->
  <rect x="46" y="43" width="28" height="6" rx="2" fill="#fbbf24" opacity="0.5"/>
  <line x1="48" y1="46" x2="70" y2="46" stroke="#1a0010" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Other code lines -->
  <line x1="48" y1="55" x2="66" y2="55" stroke="#3d1060" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="48" y1="62" x2="68" y2="62" stroke="#3d1060" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="48" y1="69" x2="60" y2="69" stroke="#3d1060" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <!-- Cursor -->
  <rect x="62" y="67" width="2" height="6" rx="1" fill="#fbbf24" opacity="0.9"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#fbbf24" opacity="0.55"/>
</svg>
