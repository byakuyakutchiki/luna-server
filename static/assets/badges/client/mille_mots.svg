<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-mille-mots" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#1a0800"/>
    </radialGradient>
    <linearGradient id="sym-mille-mots" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow-mille-mots">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#f59e0b" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-mille-mots)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#d97706" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Feather quill shape -->
  <path d="M60,30 L70,50 L65,55 L60,80 L55,55 L50,50 Z" fill="url(#sym-mille-mots)" opacity="0.9" filter="url(#glow-mille-mots)"/>
  <!-- Feather barbs left -->
  <line x1="55" y1="50" x2="44" y2="44" stroke="url(#sym-mille-mots)" stroke-width="1" opacity="0.6"/>
  <line x1="56" y1="54" x2="44" y2="50" stroke="url(#sym-mille-mots)" stroke-width="1" opacity="0.5"/>
  <line x1="57" y1="58" x2="46" y2="56" stroke="url(#sym-mille-mots)" stroke-width="1" opacity="0.4"/>
  <!-- Feather barbs right -->
  <line x1="65" y1="50" x2="76" y2="44" stroke="url(#sym-mille-mots)" stroke-width="1" opacity="0.6"/>
  <line x1="64" y1="54" x2="76" y2="50" stroke="url(#sym-mille-mots)" stroke-width="1" opacity="0.5"/>
  <line x1="63" y1="58" x2="74" y2="56" stroke="url(#sym-mille-mots)" stroke-width="1" opacity="0.4"/>
  <!-- Feather shaft -->
  <line x1="60" y1="30" x2="60" y2="80" stroke="white" stroke-width="0.8" opacity="0.35"/>
  <!-- Writing stroke -->
  <path d="M50,82 Q60,78 72,84" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#fbbf24" opacity="0.55"/>
</svg>
