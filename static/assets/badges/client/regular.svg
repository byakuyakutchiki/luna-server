<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-regular" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0d0b2a"/>
    </radialGradient>
    <linearGradient id="sym-regular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow-regular">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#6366f1" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-regular)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#6366f1" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Orbit ellipse -->
  <ellipse cx="60" cy="60" rx="30" ry="14" fill="none" stroke="url(#sym-regular)" stroke-width="1.5" transform="rotate(-20,60,60)" opacity="0.8"/>
  <!-- Second orbit ring (smaller) -->
  <ellipse cx="60" cy="60" rx="22" ry="10" fill="none" stroke="url(#sym-regular)" stroke-width="0.8" transform="rotate(20,60,60)" opacity="0.4"/>
  <!-- Moon on orbit -->
  <circle cx="82" cy="50" r="8" fill="url(#sym-regular)" filter="url(#glow-regular)"/>
  <!-- Crescent overlay (dark) -->
  <circle cx="85" cy="48" r="7" fill="#1e1b4b" opacity="0.8"/>
  <!-- Center point -->
  <circle cx="60" cy="60" r="4" fill="url(#sym-regular)" opacity="0.6"/>
  <circle cx="60" cy="60" r="2" fill="white" opacity="0.4"/>
  <!-- Small star -->
  <line x1="42" y1="72" x2="42" y2="76" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="40" y1="74" x2="44" y2="74" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#818cf8" opacity="0.55"/>
</svg>
