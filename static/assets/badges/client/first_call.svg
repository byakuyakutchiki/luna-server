<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-first-call" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3d1060"/>
      <stop offset="100%" stop-color="#110020"/>
    </radialGradient>
    <linearGradient id="sym-first-call" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-first-call">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#9b59b6" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-first-call)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#9b59b6" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Sound arcs - outer -->
  <path d="M36,60 Q60,32 84,60" fill="none" stroke="url(#sym-first-call)" stroke-width="1.5" stroke-linecap="round" opacity="0.45" filter="url(#glow-first-call)"/>
  <!-- Sound arcs - middle -->
  <path d="M42,60 Q60,40 78,60" fill="none" stroke="url(#sym-first-call)" stroke-width="2" stroke-linecap="round" opacity="0.7" filter="url(#glow-first-call)"/>
  <!-- Sound arcs - inner -->
  <path d="M48,60 Q60,48 72,60" fill="none" stroke="url(#sym-first-call)" stroke-width="2.5" stroke-linecap="round" opacity="1" filter="url(#glow-first-call)"/>
  <!-- Source dot -->
  <circle cx="60" cy="60" r="5" fill="url(#sym-first-call)" filter="url(#glow-first-call)"/>
  <circle cx="60" cy="60" r="2.5" fill="white" opacity="0.7"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#fbbf24" opacity="0.55"/>
</svg>
