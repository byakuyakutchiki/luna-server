<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-first-visio" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0d0b2a"/>
    </radialGradient>
    <linearGradient id="sym-first-visio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow-first-visio">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#6366f1" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-first-visio)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#6366f1" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Video frame -->
  <rect x="30" y="40" width="60" height="40" rx="6" fill="url(#sym-first-visio)" opacity="0.75" stroke="url(#sym-first-visio)" stroke-width="1.5" filter="url(#glow-first-visio)"/>
  <!-- Inner reflection lines -->
  <line x1="35" y1="46" x2="55" y2="44" stroke="white" stroke-width="0.8" opacity="0.2"/>
  <line x1="35" y1="50" x2="48" y2="48" stroke="white" stroke-width="0.8" opacity="0.15"/>
  <!-- Corner lights TL -->
  <rect x="30" y="40" width="5" height="5" rx="1" fill="white" opacity="0.5"/>
  <!-- Corner lights TR -->
  <rect x="85" y="40" width="5" height="5" rx="1" fill="white" opacity="0.5"/>
  <!-- Corner lights BL -->
  <rect x="30" y="75" width="5" height="5" rx="1" fill="white" opacity="0.5"/>
  <!-- Corner lights BR -->
  <rect x="85" y="75" width="5" height="5" rx="1" fill="white" opacity="0.5"/>
  <!-- Play triangle -->
  <polygon points="53,52 53,68 71,60" fill="white" opacity="0.85"/>
  <!-- Glow behind play -->
  <circle cx="62" cy="60" r="12" fill="#c084fc" opacity="0.2"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#818cf8" opacity="0.55"/>
</svg>
