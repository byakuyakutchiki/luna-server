<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-multi-canal" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0d0b2a"/>
    </radialGradient>
    <linearGradient id="sym-multi-canal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow-multi-canal">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#6366f1" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-multi-canal)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#6366f1" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Connecting lines -->
  <line x1="50" y1="50" x2="70" y2="50" stroke="url(#sym-multi-canal)" stroke-width="1.2" opacity="0.5"/>
  <line x1="50" y1="50" x2="60" y2="66" stroke="url(#sym-multi-canal)" stroke-width="1.2" opacity="0.5"/>
  <line x1="70" y1="50" x2="60" y2="66" stroke="url(#sym-multi-canal)" stroke-width="1.2" opacity="0.5"/>
  <!-- Chat circle (top-left) -->
  <circle cx="50" cy="50" r="12" fill="#1e1b4b" stroke="#60a5fa" stroke-width="1.5" filter="url(#glow-multi-canal)"/>
  <!-- Chat bubble icon -->
  <rect x="43" y="45" width="14" height="10" rx="5" fill="url(#sym-multi-canal)" opacity="0.8"/>
  <polygon points="46,54 43,58 49,54" fill="url(#sym-multi-canal)" opacity="0.8"/>
  <!-- Voice circle (top-right) -->
  <circle cx="70" cy="50" r="12" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" filter="url(#glow-multi-canal)"/>
  <!-- Sound wave icon -->
  <path d="M65,50 Q70,46 75,50" fill="none" stroke="url(#sym-multi-canal)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M65,53 Q70,49 75,53" fill="none" stroke="url(#sym-multi-canal)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <circle cx="70" cy="50" r="2" fill="url(#sym-multi-canal)" opacity="0.9"/>
  <!-- Video circle (bottom) -->
  <circle cx="60" cy="66" r="12" fill="#1e1b4b" stroke="#fbbf24" stroke-width="1.5" filter="url(#glow-multi-canal)"/>
  <!-- Camera icon (simplified) -->
  <rect x="53" y="61" width="10" height="8" rx="2" fill="url(#sym-multi-canal)" opacity="0.8"/>
  <polygon points="63,63 68,61 68,69 63,67" fill="url(#sym-multi-canal)" opacity="0.7"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#818cf8" opacity="0.55"/>
</svg>
