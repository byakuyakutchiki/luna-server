<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-conteur" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3d1060"/>
      <stop offset="100%" stop-color="#110020"/>
    </radialGradient>
    <linearGradient id="sym-conteur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-conteur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#9b59b6" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-conteur)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#9b59b6" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Left page -->
  <polygon points="40,42 58,40 58,78 40,76" fill="url(#sym-conteur)" opacity="0.75" filter="url(#glow-conteur)"/>
  <!-- Right page -->
  <polygon points="62,40 80,42 80,76 62,78" fill="url(#sym-conteur)" opacity="0.85" filter="url(#glow-conteur)"/>
  <!-- Spine glow -->
  <line x1="60" y1="40" x2="60" y2="78" stroke="white" stroke-width="2" opacity="0.5"/>
  <!-- Left page text lines -->
  <line x1="43" y1="50" x2="56" y2="50" stroke="#110020" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="43" y1="55" x2="56" y2="55" stroke="#110020" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="43" y1="60" x2="56" y2="60" stroke="#110020" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="43" y1="65" x2="52" y2="65" stroke="#110020" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Right page text lines -->
  <line x1="64" y1="50" x2="77" y2="50" stroke="#110020" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="64" y1="55" x2="77" y2="55" stroke="#110020" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="64" y1="60" x2="77" y2="60" stroke="#110020" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="64" y1="65" x2="74" y2="65" stroke="#110020" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Gold star on right page -->
  <line x1="70" y1="72" x2="70" y2="76" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="68" y1="74" x2="72" y2="74" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#fbbf24" opacity="0.55"/>
</svg>
