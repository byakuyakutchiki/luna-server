<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-protector" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <linearGradient id="sym-protector" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow-protector">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#7c3aed" opacity="0.2"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-protector)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#7c3aed" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Shield -->
  <path d="M60,30 L80,40 L80,60 Q80,76 60,84 Q40,76 40,60 L40,40 Z" fill="url(#sym-protector)" opacity="0.85" filter="url(#glow-protector)"/>
  <!-- Shield highlight -->
  <path d="M60,35 L75,43 L75,60 Q75,72 60,79" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
  <!-- Luna crescent inside shield -->
  <path d="M56,50 Q60,45 66,48 Q61,50 61,57 Q55,56 56,50 Z" fill="white" opacity="0.7"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#a78bfa" opacity="0.55"/>
</svg>
