<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-first-contact" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e3a6e"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>
    <linearGradient id="sym-first-contact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-first-contact">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#3b82f6" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-first-contact)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#3b82f6" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Main arc -->
  <path d="M35,70 Q60,35 85,70" fill="none" stroke="url(#sym-first-contact)" stroke-width="3" stroke-linecap="round" filter="url(#glow-first-contact)"/>
  <!-- Reflection arc -->
  <path d="M40,68 Q60,40 80,68" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <!-- Center meeting point -->
  <circle cx="60" cy="57" r="5" fill="url(#sym-first-contact)" filter="url(#glow-first-contact)"/>
  <circle cx="60" cy="57" r="2.5" fill="white" opacity="0.6"/>
  <!-- Left endpoint -->
  <circle cx="35" cy="70" r="4" fill="url(#sym-first-contact)" opacity="0.8"/>
  <!-- Right endpoint -->
  <circle cx="85" cy="70" r="4" fill="url(#sym-first-contact)" opacity="0.8"/>
  <!-- Small sparkles -->
  <line x1="60" y1="50" x2="60" y2="46" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="56" y1="53" x2="64" y2="53" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#fbbf24" opacity="0.55"/>
</svg>
