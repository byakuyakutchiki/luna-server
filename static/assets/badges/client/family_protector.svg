<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-family-protector" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#1a0800"/>
    </radialGradient>
    <linearGradient id="sym-family-protector" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow-family-protector">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#f59e0b" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-family-protector)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#d97706" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Shield outer -->
  <path d="M60,32 L78,40 L78,62 Q78,74 60,82 Q42,74 42,62 L42,40 Z" fill="url(#sym-family-protector)" opacity="0.85" filter="url(#glow-family-protector)"/>
  <!-- Shield inner outline -->
  <path d="M60,37 L73,44 L73,62 Q73,71 60,77 Q47,71 47,62 L47,44 Z" fill="none" stroke="white" stroke-width="0.8" opacity="0.4"/>
  <!-- Shield edge highlights -->
  <path d="M60,32 L78,40" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
  <path d="M60,32 L42,40" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
  <!-- Center star 4-branch -->
  <line x1="60" y1="51" x2="60" y2="67" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="52" y1="59" x2="68" y2="59" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <!-- Diagonal star branches -->
  <line x1="54" y1="53" x2="66" y2="65" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <line x1="66" y1="53" x2="54" y2="65" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <!-- Center gem -->
  <circle cx="60" cy="59" r="4" fill="white" opacity="0.3"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#fbbf24" opacity="0.55"/>
</svg>
