<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-pioneer" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="sym-pioneer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow-pioneer">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#0ea5e9" opacity="0.2"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-pioneer)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#0ea5e9" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Rocket -->
  <ellipse cx="60" cy="50" rx="8" ry="16" fill="url(#sym-pioneer)" opacity="0.9" filter="url(#glow-pioneer)"/>
  <polygon points="52,58 48,72 60,66 72,72 68,58" fill="#0ea5e9" opacity="0.75"/>
  <!-- Window -->
  <circle cx="60" cy="48" r="4" fill="none" stroke="white" stroke-width="1.5" opacity="0.8"/>
  <!-- Flames -->
  <ellipse cx="56" cy="73" rx="3" ry="5" fill="#fbbf24" opacity="0.8"/>
  <ellipse cx="60" cy="75" rx="3" ry="6" fill="#f97316" opacity="0.9" filter="url(#glow-pioneer)"/>
  <ellipse cx="64" cy="73" rx="3" ry="5" fill="#fbbf24" opacity="0.8"/>
  <!-- Stars -->
  <circle cx="38" cy="38" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="82" cy="42" r="1" fill="#38bdf8" opacity="0.5"/>
  <circle cx="44" cy="78" r="1" fill="#38bdf8" opacity="0.4"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#38bdf8" opacity="0.55"/>
</svg>
