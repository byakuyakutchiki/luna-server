<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-level5" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>
    <linearGradient id="sym-level5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="glow-level5">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#3b82f6" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-level5)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#2563eb" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Medal ring -->
  <circle cx="60" cy="60" r="24" fill="none" stroke="url(#sym-level5)" stroke-width="2.5" filter="url(#glow-level5)"/>
  <!-- 5-point star -->
  <polygon points="60,38 64.7,52 79.5,52 67.9,61.1 72.6,75.1 60,66 47.4,75.1 52.1,61.1 40.5,52 55.3,52" fill="url(#sym-level5)" filter="url(#glow-level5)"/>
  <!-- Inner highlight -->
  <polygon points="60,44 63.5,54 73.6,54 65.6,59.8 68.5,70 60,64 51.5,70 54.4,59.8 46.4,54 56.5,54" fill="white" opacity="0.15"/>
  <!-- Roman numeral V at center -->
  <line x1="55" y1="54" x2="58" y2="65" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="65" y1="54" x2="62" y2="65" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Dots at 5 points -->
  <circle cx="60" cy="38" r="2" fill="#dbeafe" opacity="0.9"/>
  <circle cx="79.5" cy="52" r="2" fill="#dbeafe" opacity="0.9"/>
  <circle cx="72.6" cy="75.1" r="2" fill="#dbeafe" opacity="0.9"/>
  <circle cx="47.4" cy="75.1" r="2" fill="#dbeafe" opacity="0.9"/>
  <circle cx="40.5" cy="52" r="2" fill="#dbeafe" opacity="0.9"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#60a5fa" opacity="0.55"/>
</svg>
