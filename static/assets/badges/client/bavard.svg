<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-bavard" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0d0b2a"/>
    </radialGradient>
    <linearGradient id="sym-bavard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow-bavard">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="57" fill="#6366f1" opacity="0.25"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#bg-bavard)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#6366f1" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Large bubble -->
  <rect x="34" y="38" width="36" height="24" rx="12" fill="url(#sym-bavard)" opacity="0.85" filter="url(#glow-bavard)"/>
  <!-- Large bubble tail -->
  <polygon points="40,61 35,72 48,61" fill="url(#sym-bavard)" opacity="0.85"/>
  <!-- Lines in large bubble -->
  <line x1="42" y1="46" x2="62" y2="46" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  <line x1="42" y1="52" x2="60" y2="52" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  <!-- Small bubble -->
  <rect x="60" y="58" width="24" height="18" rx="9" fill="url(#sym-bavard)" opacity="0.7" filter="url(#glow-bavard)"/>
  <!-- Small bubble tail right -->
  <polygon points="78,75 84,82 76,75" fill="url(#sym-bavard)" opacity="0.7"/>
  <!-- Lines in small bubble -->
  <line x1="66" y1="65" x2="76" y2="65" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="66" y1="70" x2="74" y2="70" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Speech dots -->
  <circle cx="88" cy="50" r="2" fill="#c084fc" opacity="0.6"/>
  <circle cx="92" cy="44" r="1.5" fill="#c084fc" opacity="0.4"/>
  <circle cx="94" cy="38" r="1" fill="#c084fc" opacity="0.2"/>
  <!-- Bottom bar -->
  <rect x="32" y="95" width="56" height="2.5" rx="1.25" fill="#818cf8" opacity="0.55"/>
</svg>
