<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Luna IA — Visio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100vh; height: 100dvh; overflow: hidden; background: #000; color: #e0e0e0; font-family: system-ui, -apple-system, sans-serif; -webkit-user-select: none; user-select: none; }

    /* ===== FULLSCREEN WRAP ===== */
    .avatar-wrap {
      position: fixed; inset: 0; width: 100%; height: 100%; background: #000; overflow: hidden;
    }

    /* ===== CINEMATIQUE ===== */
    .zoom-container {
      position: absolute; inset: 0; z-index: 2;
      transition: transform 2.5s cubic-bezier(0.25, 0.1, 0.25, 1);
      transform-origin: center center;
    }
    .zoom-container.cinematic { filter: saturate(0.88) contrast(1.06) sepia(0.06) brightness(0.97); }
    @keyframes kenBurnsDrift {
      0%   { transform: scale(1.0)  translate(0, 0); }
      25%  { transform: scale(1.03) translate(-0.5%, -0.3%); }
      50%  { transform: scale(1.06) translate(-0.8%, 0.2%); }
      75%  { transform: scale(1.04) translate(0.3%, -0.5%); }
      100% { transform: scale(1.08) translate(-0.3%, -0.4%); }
    }
    .zoom-container.drifting { animation: kenBurnsDrift 25s ease-in-out forwards; }

    /* Fond de scene — couvre l'ecran en paysage, cadre cinema en portrait */
    .scene-bg {
      position: absolute; inset: 0; z-index: 1; opacity: 0;
      width: 100%; height: 100%;
      background-repeat: no-repeat;
      transition: opacity 2.5s ease;
    }
    /* Paysage / desktop : le SVG 16:9 couvre naturellement l'ecran */
    .scene-bg { background-size: cover; background-position: center center; }
    /* Portrait mobile : la scene occupe la majorite de l'ecran en hauteur */
    @media (orientation: portrait) {
      .scene-bg {
        background-size: 200% auto;
        background-position: center 40%;
      }
    }
    .scene-bg.fade-out { transition: opacity 2s ease; opacity: 0 !important; }

    .light-sweep {
      position: absolute; inset: 0; z-index: 2; opacity: 0; pointer-events: none;
      background: linear-gradient(105deg, transparent 35%, rgba(255,248,220,0.04) 42%, rgba(255,248,220,0.12) 48%, rgba(255,248,220,0.18) 50%, rgba(255,248,220,0.12) 52%, rgba(255,248,220,0.04) 58%, transparent 65%);
      background-size: 250% 100%; transition: opacity 0.5s ease;
    }
    .light-sweep.active { opacity: 1; animation: sweepAnamorphic 5s ease-in-out 1; }
    @keyframes sweepAnamorphic { 0% { background-position: 250% 0; } 100% { background-position: -250% 0; } }

    /* Telephone */
    .phone-device {
      position: absolute; z-index: 3; opacity: 0; pointer-events: none;
      transition: opacity 1.4s ease, transform 1.4s ease;
      transform: translateY(8px);
      bottom: 22%; right: 18%; width: 70px; height: 124px; perspective: 600px;
    }
    @media (orientation: portrait) {
      .phone-device { bottom: 35%; right: auto; left: 50%; margin-left: -30px; width: 60px; height: 106px; }
    }
    .phone-device.visible { opacity: 1; transform: translateY(0); }
    .phone-device.vibrating { animation: phoneBuzz 0.08s linear infinite; }
    @keyframes phoneBuzz {
      0%   { transform: translate(0, 0) rotate(0deg); }
      20%  { transform: translate(-1.5px, 0.5px) rotate(-0.8deg); }
      40%  { transform: translate(1.5px, -0.5px) rotate(0.8deg); }
      60%  { transform: translate(-1px, -0.5px) rotate(-0.4deg); }
      80%  { transform: translate(1px, 0.5px) rotate(0.5deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
    .phone-body {
      width: 100%; height: 100%;
      background: linear-gradient(145deg, #2a2a3e, #1a1a2e);
      border-radius: 16px; border: 1.5px solid #444;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7), 0 4px 12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
      overflow: hidden; display: flex; flex-direction: column; position: relative;
      transform: rotateY(-3deg) rotateX(1deg); transform-style: preserve-3d;
    }
    .phone-notch { width: 28%; height: 4px; margin: 5px auto 0; background: #333; border-radius: 3px; }
    .phone-screen {
      flex: 1; margin: 4px 5px 6px; background: #080818; border-radius: 10px;
      overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center;
    }
    .phone-screen::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.03) 100%);
      pointer-events: none; z-index: 5; border-radius: 10px;
    }
    .phone-screen.lit { background: linear-gradient(135deg, #1a1a3e, #2a2a5e); box-shadow: inset 0 0 30px rgba(124,140,248,0.2); }
    .phone-home-btn { width: 14px; height: 14px; margin: 0 auto 5px; border-radius: 50%; border: 1.5px solid #444; }
    .phone-notification { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; opacity: 0; transition: opacity 0.6s ease; z-index: 3; }
    .phone-notification.visible { opacity: 1; }
    .phone-notification .caller-icon {
      width: 32px; height: 32px; margin: 0 auto 5px;
      background: linear-gradient(135deg, #7c8cf8, #a78bfa); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: #fff; font-weight: 700;
      animation: callerPulse 1.5s ease-in-out infinite;
    }
    @keyframes callerPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(124,140,248,0.5); } 50% { box-shadow: 0 0 0 10px rgba(124,140,248,0); } }
    .phone-notification .caller-name { font-size: 8px; color: #fff; font-weight: 700; letter-spacing: 0.5px; }
    .phone-notification .caller-label { font-size: 6.5px; color: #bbb; margin-top: 1px; }
    .phone-glow { position: absolute; inset: -25px; z-index: -1; border-radius: 28px; opacity: 0; transition: opacity 0.4s ease; background: radial-gradient(ellipse, rgba(124,140,248,0.35), transparent 65%); }
    .phone-device.ringing .phone-glow { opacity: 1; animation: glowPulse 1.2s ease-in-out infinite; }
    @keyframes glowPulse { 0%, 100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }

    /* Mini avatar dans le telephone */
    .phone-avatar-frame {
      position: absolute; inset: 0; z-index: 4; border-radius: 10px; overflow: hidden;
      opacity: 0; transition: opacity 1s ease;
    }
    .phone-avatar-frame.visible { opacity: 1; }
    .phone-avatar-frame iframe {
      width: 100%; height: 100%; border: none; border-radius: 10px;
      pointer-events: none; transform: scale(1.5); transform-origin: center center;
    }

    /* Sous-titres cinema */
    .mise-en-scene {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 8;
      padding: 32px 24px calc(28px + env(safe-area-inset-bottom));
      background: linear-gradient(transparent 0%, rgba(0,0,0,0.8) 100%);
      transition: opacity 1.5s ease;
    }
    .mise-en-scene.hidden { opacity: 0; pointer-events: none; }
    .scene-text {
      font-family: Georgia, 'Times New Roman', serif; font-size: 17px; color: rgba(255,255,255,0.92);
      font-style: italic; letter-spacing: 1.2px; line-height: 1.6;
      text-shadow: 0 2px 20px rgba(0,0,0,0.9), 0 0px 8px rgba(0,0,0,0.5);
      animation: subtitleReveal 2s ease;
    }
    @keyframes subtitleReveal { 0% { opacity: 0; transform: translateY(12px); } 100% { opacity: 1; transform: translateY(0); } }
    .scene-dots { margin-top: 5px; display: inline-block; }
    .scene-dots span { font-size: 22px; color: rgba(255,255,255,0.7); opacity: 0; animation: dotFade 1.6s infinite; }
    .scene-dots span:nth-child(2) { animation-delay: 0.3s; }
    .scene-dots span:nth-child(3) { animation-delay: 0.6s; }
    @keyframes dotFade { 0%,80%,100% { opacity:0; } 40% { opacity:1; } }

    /* Vignette + Grain + Letterbox */
    .vignette { position: absolute; inset: 0; z-index: 9; pointer-events: none; opacity: 0; background: radial-gradient(ellipse 70% 60% at 50% 50%, transparent 0%, transparent 55%, rgba(0,0,0,0.25) 75%, rgba(0,0,0,0.6) 100%); transition: opacity 1.5s ease; }
    .vignette.active { opacity: 1; }
    .vignette.intense { background: radial-gradient(ellipse 60% 50% at 50% 50%, transparent 0%, transparent 40%, rgba(0,0,0,0.35) 70%, rgba(0,0,0,0.75) 100%); }
    #grainCanvas { position: absolute; inset: 0; z-index: 10; width: 100%; height: 100%; pointer-events: none; opacity: 0; mix-blend-mode: overlay; transition: opacity 0.8s ease; image-rendering: pixelated; }
    #grainCanvas.active { opacity: 1; }
    .letterbox-top, .letterbox-bottom { position: absolute; left: 0; right: 0; z-index: 15; background: #000; height: 0; transition: height 1.5s cubic-bezier(0.4, 0, 0.2, 1); }
    .letterbox-top { top: 0; } .letterbox-bottom { bottom: 0; }
    .letterbox-top.active, .letterbox-bottom.active { height: 11%; }
    .letterbox-top.retract, .letterbox-bottom.retract { height: 0; transition: height 1.2s cubic-bezier(0.4, 0, 0.2, 1); }

    /* ===== TAVUS VIDEO FULLSCREEN ===== */
    #tavusFrame {
      position: fixed; inset: 0; z-index: 20; width: 100%; height: 100%;
      opacity: 0; transition: opacity 1.5s ease; pointer-events: none;
    }
    #tavusFrame.visible { opacity: 1; pointer-events: auto; }
    #tavusFrame iframe { width: 100%; height: 100%; border: none; }

    /* ===== HANGUP BUTTON ===== */
    .btn-hangup {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); z-index: 60;
      background: #e94560; color: #fff; border: none; border-radius: 50px;
      padding: 14px 40px; font-size: 16px; font-weight: 700; cursor: pointer;
      min-height: 52px; display: none; align-items: center; gap: 8px;
      box-shadow: 0 4px 20px rgba(233,69,96,0.4);
      padding-bottom: calc(14px + env(safe-area-inset-bottom));
    }
    .btn-hangup.visible { display: flex; }
    .btn-hangup:hover { background: #d63050; }

    /* ===== ECRAN DE DEMARRAGE ===== */
    .start-screen {
      position: fixed; inset: 0; z-index: 40;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
    }
    .start-screen.hidden { display: none; }
    .start-logo {
      width: 80px; height: 80px; border-radius: 50%;
      background: linear-gradient(135deg, #7c8cf8, #a78bfa);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; color: #fff; font-weight: 700; margin-bottom: 24px;
      box-shadow: 0 0 40px rgba(124,140,248,0.3);
    }
    .start-screen h2 { font-size: 24px; color: #fff; margin-bottom: 8px; }
    .start-screen p { font-size: 14px; color: #888; margin-bottom: 32px; max-width: 300px; line-height: 1.5; }
    .start-screen .btn-start-big {
      background: #0a6; color: #fff; border: none; border-radius: 50px;
      padding: 16px 48px; font-size: 18px; font-weight: 700; cursor: pointer;
      min-height: 56px; transition: all 0.15s;
      box-shadow: 0 4px 20px rgba(0,170,100,0.3);
    }
    .start-screen .btn-start-big:hover { background: #0b7; transform: scale(1.02); }
    .start-screen .btn-start-big:disabled { opacity: 0.5; cursor: not-allowed; }
    .start-back-link { margin-top: 24px; color: #888; font-size: 13px; text-decoration: none; }
    .start-back-link:hover { color: #aaa; }

    /* Loading spinner in start screen */
    .start-loading { display: none; margin-top: 16px; color: #888; font-size: 13px; }
    .start-loading.visible { display: block; }
  </style>
</head>
<body>

  <!-- ECRAN DE DEMARRAGE -->
  <div class="start-screen" id="startScreen">
    <div class="start-logo">L</div>
    <h2>Visio avec Luna</h2>
    <p>Luna vous voit et vous entend. Parlez naturellement, elle vous repond en direct.</p>
    <button class="btn-start-big" id="btnStartBig">Demarrer</button>
    <div class="start-loading" id="startLoading">Connexion en cours...</div>
    <a href="/" class="start-back-link">&larr; Retour au chat</a>
  </div>

  <!-- AVATAR FULLSCREEN -->
  <div class="avatar-wrap" id="avatarWrap">
    <!-- Cinematique layers -->
    <div class="zoom-container" id="zoomContainer">
      <div id="sceneBackground" class="scene-bg"></div>
      <div id="lightSweep" class="light-sweep"></div>
      <div id="phoneDevice" class="phone-device">
        <div class="phone-glow"></div>
        <div class="phone-body">
          <div class="phone-notch"></div>
          <div class="phone-screen" id="phoneScreen">
            <div id="phoneNotification" class="phone-notification">
              <div class="caller-icon">L</div>
              <div class="caller-name">Luna</div>
              <div class="caller-label">Appel entrant...</div>
            </div>
            <!-- Luna avatar mini dans le tel -->
            <div id="phoneAvatarFrame" class="phone-avatar-frame"></div>
          </div>
          <div class="phone-home-btn"></div>
        </div>
      </div>
    </div>

    <!-- Sous-titres cinema -->
    <div id="miseEnScene" class="mise-en-scene hidden">
      <p id="sceneText" class="scene-text"></p>
      <div class="scene-dots"><span>.</span><span>.</span><span>.</span></div>
    </div>

    <!-- Effets cinema -->
    <div id="vignette" class="vignette"></div>
    <canvas id="grainCanvas" width="320" height="180"></canvas>
    <div id="letterboxTop" class="letterbox-top"></div>
    <div id="letterboxBottom" class="letterbox-bottom"></div>

    <!-- Audio -->
    <audio id="ambientAudio" loop></audio>
    <audio id="phoneSfx"></audio>
  </div>

  <!-- TAVUS VIDEO FULLSCREEN (Daily.js injecte ici) -->
  <div id="tavusFrame"></div>

  <!-- HANGUP -->
  <button class="btn-hangup" id="btnHangup">Raccrocher</button>

  <!-- Daily.js SDK -->
  <script crossorigin src="https://unpkg.com/@daily-co/daily-js"></script>

  <script>
    // =====================================================================
    // PLANNING HORAIRE
    // =====================================================================
    var LUNA_SCHEDULE = [
      { start: 6,  end: 8,  bg: 'bg_bedroom.svg',           ambient: 'ambient_morning.mp3',
        text: 'Luna se r\u00e9veille doucement\u2026',
        phone: { bottom: '25%', right: '60%', width: '55px', height: '96px' },
        zoomTarget: { x: '40%', y: '75%', scale: 7 } },
      { start: 8,  end: 10, bg: 'bg_kitchen_morning.svg',    ambient: 'ambient_kitchen.mp3',
        text: 'Luna pr\u00e9pare son th\u00e9\u2026',
        phone: { bottom: '16%', right: '32%', width: '60px', height: '106px' },
        zoomTarget: { x: '68%', y: '84%', scale: 6 } },
      { start: 10, end: 12, bg: 'bg_livingroom_day.svg',     ambient: 'ambient_calm.mp3',
        text: 'Luna lit tranquillement\u2026',
        phone: { bottom: '18%', right: '20%', width: '55px', height: '96px' },
        zoomTarget: { x: '80%', y: '82%', scale: 7 } },
      { start: 12, end: 14, bg: 'bg_kitchen_lunch.svg',      ambient: 'ambient_cooking.mp3',
        text: 'Luna pr\u00e9pare le d\u00e9jeuner\u2026',
        phone: { bottom: '16%', right: '32%', width: '60px', height: '106px' },
        zoomTarget: { x: '68%', y: '84%', scale: 6 } },
      { start: 14, end: 16, bg: 'bg_park.svg',               ambient: 'ambient_nature.mp3',
        text: 'Luna profite du soleil\u2026',
        phone: { bottom: '22%', right: '40%', width: '52px', height: '92px' },
        zoomTarget: { x: '60%', y: '78%', scale: 7 } },
      { start: 16, end: 18, bg: 'bg_workshop.svg',           ambient: 'ambient_creative.mp3',
        text: "Luna peint dans son atelier\u2026",
        phone: { bottom: '16%', right: '40%', width: '50px', height: '88px' },
        zoomTarget: { x: '60%', y: '84%', scale: 7.5 } },
      { start: 18, end: 20, bg: 'bg_kitchen_dinner.svg',     ambient: 'ambient_cooking.mp3',
        text: 'Luna cuisine le d\u00eener\u2026',
        phone: { bottom: '16%', right: '32%', width: '60px', height: '106px' },
        zoomTarget: { x: '68%', y: '84%', scale: 6 } },
      { start: 20, end: 22, bg: 'bg_livingroom_evening.svg', ambient: 'ambient_cozy.mp3',
        text: "Luna se d\u00e9tend pr\u00e8s du feu\u2026",
        phone: { bottom: '20%', right: '22%', width: '55px', height: '96px' },
        zoomTarget: { x: '78%', y: '80%', scale: 7 } },
      { start: 22, end: 6,  bg: 'bg_night.svg',              ambient: 'ambient_night.mp3',
        text: 'Luna se pr\u00e9pare \u00e0 dormir\u2026',
        phone: { bottom: '30%', right: '68%', width: '50px', height: '88px' },
        zoomTarget: { x: '32%', y: '70%', scale: 7.5 } },
    ];

    function getCurrentScene() {
      var h = new Date().getHours();
      for (var i = 0; i < LUNA_SCHEDULE.length; i++) {
        var s = LUNA_SCHEDULE[i];
        if (s.start < s.end) { if (h >= s.start && h < s.end) return s; }
        else { if (h >= s.start || h < s.end) return s; }
      }
      return LUNA_SCHEDULE[LUNA_SCHEDULE.length - 1];
    }

    // =====================================================================
    // DOM
    // =====================================================================
    function $(id) { return document.getElementById(id); }
    var btnStartBig     = $('btnStartBig');
    var startScreen     = $('startScreen');
    var startLoading    = $('startLoading');
    var tavusFrameEl    = $('tavusFrame');
    var btnHangup       = $('btnHangup');

    // Cinematique
    var sceneBackgroundEl = $('sceneBackground');
    var zoomContainer     = $('zoomContainer');
    var miseEnSceneEl     = $('miseEnScene');
    var sceneTextEl       = $('sceneText');
    var ambientAudioEl    = $('ambientAudio');
    var phoneSfxEl        = $('phoneSfx');
    var phoneDevice       = $('phoneDevice');
    var phoneScreen       = $('phoneScreen');
    var phoneNotification = $('phoneNotification');
    var phoneAvatarFrame  = $('phoneAvatarFrame');
    var vignetteEl        = $('vignette');
    var grainCanvas       = $('grainCanvas');
    var grainCtx          = grainCanvas.getContext('2d');
    var lightSweep        = $('lightSweep');
    var letterboxTop      = $('letterboxTop');
    var letterboxBottom   = $('letterboxBottom');

    var currentScene = null;
    var dailyCall = null;
    var currentConvId = '';
    var grainAnimId = null;
    var lastGrainTime = 0;

    function wait(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

    // =====================================================================
    // AUTH (meme token que index.html, meme origin)
    // =====================================================================
    function getToken() { return localStorage.getItem('luna_token') || ''; }
    function authFetch(url, options) {
      var opts = options || {};
      opts.headers = opts.headers || {};
      var t = getToken();
      if (t) opts.headers['Authorization'] = 'Bearer ' + t;
      return fetch(url, opts).then(function(r) {
        if (r.status === 401) { window.location.href = '/'; throw new Error('Session expiree'); }
        return r;
      });
    }

    // =====================================================================
    // FILM GRAIN
    // =====================================================================
    function startGrain() {
      grainCanvas.classList.add('active');
      lastGrainTime = 0;
      function render(now) {
        grainAnimId = requestAnimationFrame(render);
        if (now - lastGrainTime < 70) return;
        lastGrainTime = now;
        var w = 320, h = 180;
        var img = grainCtx.createImageData(w, h);
        var d = img.data;
        for (var i = 0; i < d.length; i += 4) {
          var v = (Math.random() * 40) | 0;
          d[i] = d[i+1] = d[i+2] = v; d[i+3] = 18;
        }
        grainCtx.putImageData(img, 0, 0);
      }
      render(0);
    }
    function stopGrain() {
      if (grainAnimId) { cancelAnimationFrame(grainAnimId); grainAnimId = null; }
      grainCtx.clearRect(0, 0, 320, 180);
      grainCanvas.classList.remove('active');
    }

    // =====================================================================
    // CINEMATIQUE — ACTES
    // =====================================================================
    function actEstablishingShot(scene) {
      currentScene = scene;
      zoomContainer.classList.remove('cinematic', 'drifting');
      zoomContainer.style.transform = '';
      zoomContainer.style.transformOrigin = '';
      sceneBackgroundEl.classList.remove('fade-out');
      phoneDevice.classList.remove('visible', 'vibrating', 'ringing');
      phoneDevice.style.cssText = '';
      phoneScreen.classList.remove('lit');
      phoneNotification.classList.remove('visible');
      phoneAvatarFrame.classList.remove('visible');
      phoneAvatarFrame.innerHTML = '';
      vignetteEl.classList.remove('active', 'intense');
      lightSweep.classList.remove('active');
      letterboxTop.classList.remove('retract');
      letterboxBottom.classList.remove('retract');

      var isPortrait = window.innerHeight > window.innerWidth;
      if (!isPortrait) {
        // Paysage : positions specifiques par scene
        var p = scene.phone;
        phoneDevice.style.bottom = p.bottom;
        phoneDevice.style.right = p.right;
        phoneDevice.style.width = p.width;
        phoneDevice.style.height = p.height;
      }
      // Portrait : positions gerees par CSS media query

      startGrain();
      letterboxTop.classList.add('active');
      letterboxBottom.classList.add('active');

      return wait(600).then(function() {
        zoomContainer.classList.add('cinematic');
        zoomContainer.classList.add('drifting');
        sceneBackgroundEl.style.backgroundImage = 'url(/static/assets/backgrounds/' + scene.bg + ')';
        sceneBackgroundEl.style.opacity = '1';

        ambientAudioEl.src = '/static/assets/sounds/' + scene.ambient;
        ambientAudioEl.volume = 0;
        ambientAudioEl.play().catch(function(){});
        var ambStep = 0;
        var ambFade = setInterval(function() {
          ambStep++;
          ambientAudioEl.volume = Math.min(0.14, ambStep * 0.007);
          if (ambStep >= 20) clearInterval(ambFade);
        }, 150);

        return wait(2000);
      }).then(function() {
        vignetteEl.classList.add('active');
        return wait(500);
      }).then(function() {
        lightSweep.classList.add('active');
        return wait(500);
      }).then(function() {
        sceneTextEl.textContent = scene.text;
        miseEnSceneEl.classList.remove('hidden');
      });
    }

    function actPhoneVibrate() {
      phoneDevice.classList.add('visible');
      return wait(600).then(function() {
        // L'ecran s'allume des la vibration (notification recue)
        phoneScreen.classList.add('lit');
        phoneSfxEl.src = '/static/assets/sounds/phone_vibrate.mp3';
        phoneSfxEl.volume = 0.2;
        phoneSfxEl.play().catch(function(){});
        phoneDevice.classList.add('vibrating');
        return wait(2500);
      }).then(function() {
        phoneDevice.classList.remove('vibrating');
        // Pause naturelle avant la sonnerie
        return wait(800);
      });
    }

    function actPhoneRing() {
      phoneDevice.classList.add('ringing');
      phoneNotification.classList.add('visible');
      sceneTextEl.textContent = 'Un appel entrant\u2026';
      phoneSfxEl.src = '/static/assets/sounds/phone_ring.mp3';
      phoneSfxEl.volume = 0.18;
      phoneSfxEl.play().catch(function(){});
      return wait(3500);
    }

    function actPhoneAnswer(conversationUrl) {
      phoneDevice.classList.remove('ringing');
      phoneSfxEl.pause();
      // Petit flash blanc sur l'ecran du telephone = decrochage
      phoneScreen.style.transition = 'background 0.15s ease';
      phoneScreen.style.background = 'rgba(255,255,255,0.3)';
      sceneTextEl.textContent = 'Luna d\u00e9croche\u2026';
      return wait(300).then(function() {
        phoneScreen.style.background = '';
        phoneNotification.classList.remove('visible');

        // Montrer le visage de Luna dans le telephone via Daily prebuilt
        if (conversationUrl) {
          var miniIframe = document.createElement('iframe');
          miniIframe.src = conversationUrl;
          miniIframe.allow = 'camera; microphone; autoplay';
          miniIframe.setAttribute('playsinline', '');
          phoneAvatarFrame.innerHTML = '';
          phoneAvatarFrame.appendChild(miniIframe);
          phoneAvatarFrame.classList.add('visible');
        }

        return wait(2500);
      });
    }

    function actCinematicZoom(conversationUrl) {
      var isPortrait = window.innerHeight > window.innerWidth;
      // En portrait : zoomer vers le telephone centre dans la scene
      var zt = isPortrait ? { x: '50%', y: '40%', scale: 5 } : currentScene.zoomTarget;
      vignetteEl.classList.add('intense');
      miseEnSceneEl.classList.add('hidden');

      return wait(500).then(function() {
        zoomContainer.classList.remove('drifting');
        zoomContainer.style.transition = 'transform 3.5s cubic-bezier(0.25, 0.1, 0.25, 1)';
        zoomContainer.style.transformOrigin = zt.x + ' ' + zt.y;
        zoomContainer.style.transform = 'scale(' + zt.scale + ')';
        return wait(2500);
      }).then(function() {
        // Transition vers Tavus fullscreen
        letterboxTop.classList.remove('active');
        letterboxTop.classList.add('retract');
        letterboxBottom.classList.remove('active');
        letterboxBottom.classList.add('retract');
        vignetteEl.classList.remove('active', 'intense');
        stopGrain();

        // Creer le Daily iframe fullscreen
        if (conversationUrl && window.DailyIframe) {
          dailyCall = window.DailyIframe.createFrame(tavusFrameEl, {
            iframeStyle: { width: '100%', height: '100%', border: 'none' },
            showLeaveButton: false,
            showFullscreenButton: false,
          });

          // Tool call handling (relay vers le backend)
          dailyCall.on('app-message', function(evt) {
            var msg = evt && evt.data;
            if (!msg) return;
            var evtType = msg.event_type || '';
            if (evtType === 'conversation.tool_call') {
              var toolName = (msg.properties && msg.properties.name) || '';
              var toolArgs = (msg.properties && msg.properties.arguments) || '{}';
              authFetch('/api/webhook/tavus', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  event_type: 'conversation.tool_call',
                  tool_name: toolName,
                  tool_arguments: toolArgs,
                  conversation_id: currentConvId,
                })
              })
              .then(function(r) { return r.json(); })
              .then(function(result) {
                var resultText = result.message || JSON.stringify(result);
                try {
                  dailyCall.sendAppMessage({
                    message_type: 'conversation',
                    event_type: 'conversation.echo',
                    conversation_id: currentConvId,
                    properties: { modality: 'text', text: resultText }
                  }, '*');
                } catch(e) {}
              })
              .catch(function() {
                try {
                  dailyCall.sendAppMessage({
                    message_type: 'conversation',
                    event_type: 'conversation.echo',
                    conversation_id: currentConvId,
                    properties: { modality: 'text', text: 'Erreur lors du traitement.' }
                  }, '*');
                } catch(e2) {}
              });
            }
          });

          dailyCall.on('left-meeting', function() { doHangup(); });

          dailyCall.join({ url: conversationUrl });

          // Fade in le fullscreen Tavus
          return wait(800).then(function() {
            tavusFrameEl.classList.add('visible');
            btnHangup.classList.add('visible');
            // Retirer les elements de cinematique
            return wait(1500);
          }).then(function() {
            // Cleanup cinematique
            zoomContainer.style.display = 'none';
            phoneAvatarFrame.innerHTML = '';
          });
        } else {
          // Pas de conversation — retour
          return wait(1000).then(function() { window.location.href = '/'; });
        }
      });
    }

    function fadeOutAmbient(durationMs) {
      if (!ambientAudioEl || ambientAudioEl.paused) return;
      var startVol = ambientAudioEl.volume;
      var steps = 25, stepMs = durationMs / steps, step = 0;
      var fade = setInterval(function() {
        step++;
        ambientAudioEl.volume = Math.max(0, startVol * (1 - step / steps));
        if (step >= steps) { clearInterval(fade); ambientAudioEl.pause(); ambientAudioEl.volume = 0.14; }
      }, stepMs);
    }

    // =====================================================================
    // TAVUS API CALL
    // =====================================================================
    function createTavusCall() {
      return authFetch('/api/call', { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.error) throw new Error(data.error);
          currentConvId = data.conversation_id;
          return data.conversation_url;
        });
    }

    // =====================================================================
    // START — Cinematique + Tavus
    // =====================================================================
    btnStartBig.onclick = function() {
      btnStartBig.disabled = true;
      startLoading.classList.add('visible');

      var conversationUrl = null;
      var scene = getCurrentScene();

      // Lancer l'appel Tavus en parallele de la cinematique
      var tavusPromise = createTavusCall().then(function(url) {
        conversationUrl = url;
      }).catch(function(err) {
        conversationUrl = null;
      });

      // Masquer ecran de demarrage
      startScreen.classList.add('hidden');

      // ACT 1 : ESTABLISHING SHOT
      actEstablishingShot(scene).then(function() {
        // Attendre que Tavus soit pret
        return tavusPromise;
      }).then(function() {
        if (!conversationUrl) {
          // Tavus non dispo, retour
          window.location.href = '/';
          return;
        }
        // ACT 2 : PHONE VIBRATE
        return actPhoneVibrate();
      }).then(function() {
        if (!conversationUrl) return;
        // ACT 3 : PHONE RING
        return actPhoneRing();
      }).then(function() {
        if (!conversationUrl) return;
        // ACT 4 : PHONE ANSWER — affiche Luna dans le tel
        return actPhoneAnswer(conversationUrl);
      }).then(function() {
        if (!conversationUrl) return;
        // Fade out ambient
        fadeOutAmbient(3000);
        // ACT 5 : ZOOM + TAVUS FULLSCREEN
        return actCinematicZoom(conversationUrl);
      }).catch(function(err) {
        window.location.href = '/';
      });
    };

    // =====================================================================
    // HANGUP
    // =====================================================================
    function doHangup() {
      if (dailyCall) {
        try { dailyCall.leave(); } catch(e) {}
        try { dailyCall.destroy(); } catch(e) {}
        dailyCall = null;
      }
      currentConvId = '';
      ambientAudioEl.pause();
      phoneSfxEl.pause();
      window.location.href = '/';
    }

    btnHangup.onclick = doHangup;

    // Android back button
    window.addEventListener('popstate', function() { doHangup(); });
    history.pushState(null, '', window.location.href);
  </script>
</body>
</html>
